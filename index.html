function groupMood(n){return MOODS.find(m=>m.n===n)||{e:'♡',a:n}}

function progress(){
 const stages={intro:0,moodMarina:1,handoffMood:1,moodVika:1,handoffVoteMarina:2,voteMarina:2,handoffVoteVika:2,voteVika:2,results:3,detail:4};

 if(state.step==='handoffVoteVika')return renderCover('Выбор Марины сохранён 🔒','Марина, передай телефон Вике. Она увидит те же четыре карточки, но не увидит ни одной твоей оценки.','Я Вика — оценить карточки','voteVika','Время передать телефон');
 if(state.step==='voteMarina'||state.step==='voteVika')return renderVote();

 root.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{
  state.moods[isMarina?0:1]=b.dataset.mood;

function renderCover(title,body,action,next,tag='Личный выбор завершён'){
 // Важно: полностью заменяем содержимое экрана, а не просто прячем предыдущие ответы CSS.
 root.innerHTML=`<div class="privacy"><p class="cover-name">${tag}</p><div class="bigicon">🔒</div><h2>${title}</h2><p>${body}</p><div class="privacy-note">На следующем экране будут только свои варианты. Чужой выбор нигде не подсвечивается.</div><div class="toolbar" style="justify-content:center"><button class="primary" id="continue">${action} →</button></div></div>`;
 document.getElementById('continue').onclick=()=>setStep(next);
}
function pickOne(pool,chosen,test){const options=pool.filter(c=>!chosen.includes(c)&&test(c));if(!options.length)return null; const shuffled=options.map(c=>({c,rank:Math.random() + (state.previous.includes(c.id)?-.8:0)+(hist.some(h=>h.id===c.id)?-.55:0) +(chosen.some(x=>x.place!==c.place)?.1:0)})).sort((a,b)=>b.rank-a.rank);return shuffled[0].c}
function draw(){
 const [a,b]=state.moods;
 if(!a||!b)throw new Error('Оба настроения должны быть выбраны до раздачи.');
 const eligible=CARDS.filter(c=>c.moods.includes(a)||c.moods.includes(b));
 const selected=[];
 const add=(test)=>{
  const c=pickOne(eligible,selected,test);
  if(c)selected.push(c);
  return c;
 };
 if(a===b){
  // Если обе выбрали одинаковое настроение, ВСЕ четыре карточки строго соответствуют ему.
  for(let i=0;i<4;i++)add(c=>c.moods.includes(a));
 }else{
  // Обе участницы гарантированно получают хотя бы одну карточку под своё настроение.
  add(c=>c.moods.includes(a)&&!c.moods.includes(b));
  add(c=>c.moods.includes(b)&&!c.moods.includes(a));
  // При наличии гибридов отдаем им приоритет: они подходят сразу обеим.
  if(add(c=>c.moods.includes(a)&&c.moods.includes(b))){
   add(c=>c.moods.includes(a)&&c.moods.includes(b))||add(()=>true);
  }else{
   // Если такой комбинации настроений пока нет, выбираем по второй идее для каждой.
   add(c=>c.moods.includes(a));
   add(c=>c.moods.includes(b));
  }
 }
 while(selected.length<4){if(!add(()=>true))break;}
 if(selected.length!==4 || selected.some(c=>!c.moods.includes(a)&&!c.moods.includes(b))){
  throw new Error('Недостаточно подходящих карточек под выбранные настроения.');
 }
 state.previous=selected.map(c=>c.id);
 // Unbiased Fisher-Yates shuffle to conceal which card was drawn for which mood.
 for(let i=selected.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]];}
 state.deal=selected;
 state.ratings=[{},{}];
 state.selected=null;
}
function cardHtml(c,i){return `<article class="idea"><div class="artcard" style="${gradient(c)}"><span class="number">0${i+1} · № ${c.id}</span><span class="artemoji" aria-hidden="true">${art(c)}</span></div><div class="bodycard"><div class="cardmeta"><span>${esc(dlabel(c))}</span><span>⏱ ${esc(c.duration)}</span></div><h3>${esc(c.title)}</h3><p class="desc">${esc(c.description)}</p><div class="rating" role="group" aria-label="Оценка: ${esc(c.title)}">${[['heart','❤️','Очень хочу'],['yes','🙂','С удовольствием'],['no','✕','Не сегодня']].map(([v,e,l])=>`<button data-card="${c.id}" data-rate="${v}" class="${state.ratings[state.step==='voteMarina'?0:1][c.id]===v?'chosen':''}" title="${l}" aria-label="${l}">${e}<span class="caption">${v==='heart'?'Хочу':v==='yes'?'Можно':'Нет'}</span></button>`).join('')}</div></div></article>`}
function renderVote(){
 const isMarina=state.step==='voteMarina',idx=isMarina?0:1,name=isMarina?'Марина':'Вика';
 const rt=state.ratings[idx],filled=Object.keys(rt).length;
 root.innerHTML=`<span class="namechip">♡ Сейчас выбирает ${name}</span>${intro('Шаг 3 из 5 · Тайное голосование',`${name}, какие идеи <em>тебе нравятся?</em>`,'Оцени все четыре идеи: ❤️ можно поставить только одной, 🙂 и ✕ — сколько угодно. Если выбрать другое ❤️, предыдущее автоматически станет 🙂.')}<div class="cards">${state.deal.map(cardHtml).join('')}</div><div class="status">Оценено: <strong>${filled}/4</strong>. Выбор другой участницы скрыт.</div><div class="toolbar"><button class="primary" id="submitVote" ${filled<4?'disabled':''}>${isMarina?'Сохранить и передать Вике':'Сохранить и показать совпадения'} →</button>${isMarina?'<button class="textbutton" id="reshuffle">Другие четыре идеи</button>':''}</div>`;
 root.querySelectorAll('[data-card]').forEach(button=>button.onclick=()=>{
  const id=Number(button.dataset.card),val=button.dataset.rate;
  if(val==='heart'){
   const old=Object.keys(rt).find(k=>rt[k]==='heart'&&Number(k)!==id);
   if(old)rt[old]='yes';
  }
  rt[id]=val;
  renderVote();
 });
 document.getElementById('submitVote').onclick=()=>setStep(isMarina?'handoffVoteVika':'results');
 if(isMarina)document.getElementById('reshuffle').onclick=()=>{draw();setStep('voteMarina')};
}
function scores(){return state.deal.map(c=>{const a=state.ratings[0][c.id]||'no',b=state.ratings[1][c.id]||'no';return {c,a,b,sum:{heart:2,yes:1,no:0}[a]+{heart:2,yes:1,no:0}[b],mutual:a!=='no'&&b!=='no'}}).sort((x,y)=>(y.mutual-x.mutual)||(y.sum-x.sum))}
function emo(r){return({heart:'❤️',yes:'🙂',no:'✕'})[r]}

}
function renderDetail(){let c=CARDS.find(c=>c.id===state.selected);if(!c)return setStep('intro');const saved=hist.some(h=>h.id===c.id);root.innerHTML=`${intro('Шаг 5 из 5 · Ваше свидание','Ваш <em>общий план.</em>','Эту идею выбрали вы обе — осталось только воплотить её!')}<div class="detailimage" style="${gradient(c)}"><span style="position:relative;z-index:1">${art(c)}</span></div><div class="cardmeta"><span>${esc(dlabel(c))}</span><span>⏱ ${esc(c.duration)}</span>${c.moods.map(m=>`<span>${groupMood(m).e} ${esc(groupMood(m).a)}</span>`).join('')}</div><div class="detailpanel"><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p>${c.details?`<p class="special"><strong>Ваши особенности:</strong> ${esc(c.details)}</p>`:''}${c.season!=='Круглый год'?`<p class="special"><strong>Когда подходит:</strong> ${esc(c.season)}.</p>`:''}</div><div class="toolbar"><button class="primary" id="savePlan">${saved?'✓ Уже в истории':'♡ Сохранить в нашу историю'}</button><button class="secondary" id="backResult">К совпадениям</button><button class="textbutton" id="startAgain">Новое свидание</button></div><p class="note">Сохранение отмечает выбранное свидание в истории на этом устройстве. Вы сможете повторить его снова.</p>`;document.getElementById('savePlan').onclick=()=>{if(!saved){hist.unshift({id:c.id,date:new Date().toISOString()});persist()}render()};document.getElementById('backResult').onclick=()=>setStep('results');document.getElementById('startAgain').onclick=reset}
function renderHistory(){root.innerHTML=`${intro('Ваша личная коллекция','Наша <em>история.</em>','Сюда попадают свидания, которые вы захотели сохранить. Все записи живут только на этом устройстве.')} ${hist.length?hist.map((h,i)=>{const c=CARDS.find(c=>c.id===h.id);return c?`<div class="historyentry"><span class="hicon">${art(c)}</span><div><strong>${esc(c.title)}</strong><small>${new Date(h.date).toLocaleDateString('ru-RU')} · ${esc(c.place)}</small></div><button class="link" data-remove="${i}" aria-label="Удалить из истории">✕</button></div>`:''}).join(''):`<div class="empty">Здесь пока пусто. Когда найдёте первое совпадение, сохраните его на память ♡</div>`}<div class="toolbar"><button class="primary" id="backHome">Вернуться в игру →</button></div>`;root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Убрать эту запись из вашей истории?')){hist.splice(Number(b.dataset.remove),1);persist();renderHistory()}});document.getElementById('backHome').onclick=reset}
function reset(){state={step:'intro',moods:[],deal:[],ratings:[{},{}],selected:null,previous:state.previous||[]};setStep('intro')}
document.getElementById('homeBtn').onclick=()=>{if(state.step==='intro'||confirm('Начать сначала? Текущие тайные выборы будут сброшены.'))reset()};document.getElementById('historyBtn').onclick=()=>setStep('history');render();
</script>
</body>
</html>
